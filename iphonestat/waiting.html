<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhoneStat</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --hairline: #e1e0d9; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
    --accent: #2a78d6; --critical: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
      --hairline: #2c2c2a; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
      --accent: #3987e5; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: min(460px, 100%); padding: 28px 28px 24px; border: 1px solid var(--hairline); border-radius: 12px;
    background: var(--surface); text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
  .lead { margin: 0 0 20px; color: var(--text-2); }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--hairline); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .message { min-height: 3em; margin: 0; overflow-wrap: anywhere; }
  .failed .message { color: var(--text); }
  .failed-title { margin: 0 0 6px; font-weight: 650; color: var(--critical); }
  .btn {
    margin-top: 16px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    padding: 8px 22px; border-radius: 6px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tips { margin: 20px 0 0; padding: 14px 0 0; border-top: 1px solid var(--hairline); color: var(--text-2);
          font-size: 13px; text-align: left; list-style: none; }
  .tips li { padding-left: 16px; position: relative; }
  .tips li::before { content: "•"; position: absolute; left: 2px; color: var(--muted); }
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite">
  <h1>iPhoneStat</h1>
  <p class="lead">Карта занятого места на iPhone</p>
  <div class="spinner" id="spinner" role="img" aria-label="Идёт сканирование"></div>
  <p class="failed-title" id="failed-title" hidden>Не получилось просканировать iPhone</p>
  <p class="message" id="message">Подключение к iPhone…</p>
  <button type="button" class="btn" id="retry" hidden>Повторить</button>
  <ul class="tips">
    <li>Подключите iPhone кабелем и разблокируйте экран.</li>
    <li>Если iPhone спросит — нажмите «Доверять» и введите код-пароль.</li>
    <li>Сканирование обычно занимает от нескольких секунд до пары минут.</li>
  </ul>
</main>
<script>
const TOKEN = "__APP_TOKEN__";
const POLL_MS = 500;
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const response = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'X-IPhoneStat-Token': TOKEN, 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const payload = await response.json();
  if (!payload.ok) throw new Error(payload.error || 'Не удалось выполнить команду.');
  return payload.data;
}

function show(failed, message) {
  $('card').classList.toggle('failed', failed);
  $('spinner').hidden = failed;
  $('failed-title').hidden = !failed;
  $('retry').hidden = !failed;
  $('message').textContent = message;
}

async function poll() {
  try {
    const { scan } = await api('/api/status');
    if (scan.phase === 'ready') { window.location.reload(); return; }
    show(scan.phase === 'failed', scan.message);
    if (scan.phase === 'failed') return;
  } catch (error) {
    show(true, 'Нет связи с приложением. Запустите iPhoneStat снова.');
    return;
  }
  setTimeout(poll, POLL_MS);
}

$('retry').addEventListener('click', async () => {
  show(false, 'Подключение к iPhone…');
  try { await api('/api/rescan', {}); } catch (error) { show(true, error.message); return; }
  poll();
});
poll();
</script>
</body>
</html>
